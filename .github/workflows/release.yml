name: Build and release

# Push a tag like v1.8.0 and GitHub builds Halo Battery on a Windows runner and
# attaches HaloBattery-<version>.zip (a HaloBattery folder with HaloBattery.exe
# and its libraries) to the release for that tag (the release is created if it
# does not exist yet). The release text is the matching section of CHANGELOG.md.
# "Run workflow" on the Actions tab builds it without releasing; download it
# from the run's artifacts.
#
# The app is built as a folder, not a single self-extracting .exe: a one-file
# PyInstaller .exe unpacks Python into a temp folder at every start, which
# antivirus machine-learning heuristics often flag as a trojan.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check that the tag matches VERSION
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $m = Select-String -Path halo_battery.pyw -Pattern '^VERSION = "(.+)"'
          $ver = $m.Matches[0].Groups[1].Value
          if ($ver -ne $tag) {
            Write-Error "Tag v$tag does not match VERSION = `"$ver`" in halo_battery.pyw"
            exit 1
          }
          Write-Host "Version $ver"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Smoke test
        # imports every module and runs one full poll on the runner (no devices there)
        run: python halo_battery.pyw --probe

      - name: Build HaloBattery
        run: |
          python tools/make_icon.py halo.ico
          python tools/make_version.py version_info.txt
          python -m PyInstaller --noconfirm --onedir --windowed --noupx --name HaloBattery --icon halo.ico --version-file version_info.txt --hidden-import hid --hidden-import pystray._win32 halo_battery.pyw

      - name: Zip the HaloBattery folder
        id: zip
        shell: pwsh
        run: |
          $m = Select-String -Path halo_battery.pyw -Pattern '^VERSION = "(.+)"'
          $ver = $m.Matches[0].Groups[1].Value
          $zip = "HaloBattery-$ver.zip"
          Compress-Archive -Path dist/HaloBattery -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT
          Write-Host "Built $zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: HaloBattery
          path: dist/HaloBattery

      - name: Release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        # fails if CHANGELOG.md has no section for this version
        run: python tools/release_notes.py ${{ github.ref_name }} --out release_notes.md

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.zip.outputs.zip }}
          fail_on_unmatched_files: true
          body_path: release_notes.md
