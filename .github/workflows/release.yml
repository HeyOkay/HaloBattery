name: Build and release

# Ordinary manual builds are unsigned artifact-only previews. Stable tags can
# publish only outputs from the complete production signing/verification chain.
# The owner-authorized v1.18.0 exception is isolated in unsigned-release-1.18.0.yml.
on:
  push:
    tags: ["v*", "!v1.18.0"]
  workflow_dispatch:
    inputs:
      signpath_test:
        description: Exercise the complete signing chain with the TEST certificate
        type: boolean
        required: true
        default: false
      signpath_release:
        description: Production signing dry run from main, without publication
        type: boolean
        required: true
        default: false

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.signpath_test && 'signpath-test' || (github.ref_type == 'tag' || inputs.signpath_release) && 'signpath-release' || format('release-build-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && !inputs.signpath_test && !inputs.signpath_release
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12.10"

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.404"

      - name: Check that the tag matches VERSION
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG.TrimStart("v")
          $m = Select-String -Path halo_battery.pyw -Pattern '^VERSION = "(.+)"'
          $ver = $m.Matches[0].Groups[1].Value
          if ($ver -ne $tag) {
            Write-Error "Tag v$tag does not match VERSION = `"$ver`" in halo_battery.pyw"
            exit 1
          }
          Write-Host "Version $ver"

      - name: Require stable tags to belong to main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Smoke test
        # imports every module and runs one full poll on the runner (no devices there)
        run: python halo_battery.pyw --probe

      - name: Build HaloBattery
        run: |
          python tools/make_icon.py halo.ico
          python tools/make_version.py version_info.txt
          ./scripts/build_settings.ps1 -ToolchainCache (Join-Path $env:RUNNER_TEMP "halo-settings-aot-toolchain")
          python tools/build_exe.py

      - name: Archive native settings symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: HaloBattery-Settings-symbols-${{ github.sha }}
          path: .build/settings-ui-obj/**/native/HaloBattery.Settings.pdb
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

      - name: Zip the HaloBattery folder
        id: zip
        shell: pwsh
        run: |
          $m = Select-String -Path halo_battery.pyw -Pattern '^VERSION = "(.+)"'
          $ver = $m.Matches[0].Groups[1].Value
          $zip = "HaloBattery-$ver.zip"
          Compress-Archive -Path dist/HaloBattery -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT
          Write-Host "Built $zip"

      - name: Build the installer
        # Inno Setup turns dist/HaloBattery into HaloBattery-<version>-setup.exe (installer/HaloBattery.iss)
        id: setup
        shell: pwsh
        run: |
          $iscc = ./scripts/get_inno.ps1
          $m = Select-String -Path halo_battery.pyw -Pattern '^VERSION = "(.+)"'
          $ver = $m.Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$ver" installer/HaloBattery.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "setup=dist/HaloBattery-$ver-setup.exe" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: HaloBattery
          path: |
            dist/HaloBattery
            ${{ steps.zip.outputs.zip }}
            ${{ steps.setup.outputs.setup }}
  publish:
    # A fresh runner receives files only. No project checkout, install or build
    # step can access the release-write token. Manual runs only create artifacts.
    needs: signing_verify
    if: always() && !cancelled() && github.event_name == 'push' && github.ref_type == 'tag' && needs.signing_verify.result == 'success' && needs.signing_verify.outputs.mode == 'Production'
    runs-on: ubuntu-latest
    concurrency:
      group: stable-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download publish assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.signing_verify.outputs.release-artifact }}
          path: release-assets

      - name: Validate release assets
        id: assets
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          zip="HaloBattery-$version.zip"
          setup="HaloBattery-$version-setup.exe"
          cd release-assets
          # Build output is data only. Reject unexpected files and symlinks.
          [[ "$(find . -mindepth 1 -maxdepth 1 | wc -l)" -eq 4 ]]
          for file in "$zip" "$setup" SHA256SUMS.txt release_notes.md; do
            [[ -f "$file" && ! -L "$file" ]]
          done
          # Compute hashes only for the two expected names, never paths from a manifest.
          expected="$(mktemp "$RUNNER_TEMP/halobattery-expected.XXXXXX")"
          actual="$(mktemp "$RUNNER_TEMP/halobattery-actual.XXXXXX")"
          trap 'rm -f "$expected" "$actual"' EXIT
          printf '%s *%s\n' "$(sha256sum "$zip" | cut -d ' ' -f 1)" "$zip" \
            "$(sha256sum "$setup" | cut -d ' ' -f 1)" "$setup" > "$expected"
          sed 's/\r$//' SHA256SUMS.txt > "$actual"
          cmp --silent "$expected" "$actual"
          echo "zip=release-assets/$zip" >> "$GITHUB_OUTPUT"
          echo "setup=release-assets/$setup" >> "$GITHUB_OUTPUT"
          echo "zip-sha256=$(sha256sum "$zip" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "setup-sha256=$(sha256sum "$setup" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "sums-sha256=$(sha256sum SHA256SUMS.txt | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMMUTABILITY_ENABLED: ${{ vars.STABLE_RELEASE_IMMUTABILITY_ENABLED }}
          ZIP: ${{ steps.assets.outputs.zip }}
          SETUP: ${{ steps.assets.outputs.setup }}
          ZIP_SHA256: ${{ steps.assets.outputs.zip-sha256 }}
          SETUP_SHA256: ${{ steps.assets.outputs.setup-sha256 }}
          SUMS_SHA256: ${{ steps.assets.outputs.sums-sha256 }}
        run: |
          # The owner sets this acknowledgement only after enabling repository
          # release immutability. Reading that setting requires an admin token,
          # which this deliberately limited publisher must never receive.
          if [[ "$IMMUTABILITY_ENABLED" != true ]]; then
            echo "Enable repository release immutability and set STABLE_RELEASE_IMMUTABILITY_ENABLED=true before publishing." >&2
            exit 1
          fi
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          version="${RELEASE_TAG#v}"
          [[ "$ZIP" == "release-assets/HaloBattery-$version.zip" ]]
          [[ "$SETUP" == "release-assets/HaloBattery-$version-setup.exe" ]]
          # Include every page and drafts. Reruns never overwrite old assets;
          # partial drafts require explicit owner inspection and recovery.
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")"
          if [[ -n "$existing" ]]; then
            echo "Refusing to modify an existing release or draft for $RELEASE_TAG." >&2
            exit 1
          fi
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.ref')" == "refs/tags/$RELEASE_TAG" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')" == "$GITHUB_SHA" ]]
          release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f "tag_name=$RELEASE_TAG" -f "target_commitish=$GITHUB_SHA" -f "name=$RELEASE_TAG" \
            -F draft=true -F body=@release-assets/release_notes.md --jq '.id')"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          identity="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '[.id,.draft,.tag_name] | @tsv')"
          [[ "$identity" == "$release_id"$'\ttrue\t'"$RELEASE_TAG" ]]
          initial_assets="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq '.[].id')"
          [[ -z "$initial_assets" ]]
          # Deliberately no replacement/delete option, including for drafts.
          gh release upload "$RELEASE_TAG" "$ZIP" "$SETUP" release-assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY"
          expected="$(printf '%s\tsha256:%s\tuploaded\n' "${ZIP##*/}" "$ZIP_SHA256" \
            "${SETUP##*/}" "$SETUP_SHA256" SHA256SUMS.txt "$SUMS_SHA256" | LC_ALL=C sort)"
          uploaded="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
            --jq '.[] | [.name,.digest,.state] | @tsv' | LC_ALL=C sort)"
          [[ "$uploaded" == "$expected" ]]
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Attest validated release assets
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.assets.outputs.zip }}
            ${{ steps.assets.outputs.setup }}
          create-storage-record: false

      - name: Publish attested draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ steps.draft.outputs.release-id }}
          ZIP: ${{ steps.assets.outputs.zip }}
          SETUP: ${{ steps.assets.outputs.setup }}
          ZIP_SHA256: ${{ steps.assets.outputs.zip-sha256 }}
          SETUP_SHA256: ${{ steps.assets.outputs.setup-sha256 }}
          SUMS_SHA256: ${{ steps.assets.outputs.sums-sha256 }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          [[ "$(sha256sum "$ZIP" | cut -d ' ' -f 1)" == "$ZIP_SHA256" ]]
          [[ "$(sha256sum "$SETUP" | cut -d ' ' -f 1)" == "$SETUP_SHA256" ]]
          [[ "$(sha256sum release-assets/SHA256SUMS.txt | cut -d ' ' -f 1)" == "$SUMS_SHA256" ]]
          for subject in "$ZIP" "$SETUP"; do
            gh attestation verify "$subject" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$GITHUB_SHA" \
              --bundle "$ATTESTATION_BUNDLE"
          done
          identity="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '[.id,.draft,.tag_name] | @tsv')"
          [[ "$identity" == "$RELEASE_ID"$'\ttrue\t'"$RELEASE_TAG" ]]
          expected="$(printf '%s\tsha256:%s\tuploaded\n' "${ZIP##*/}" "$ZIP_SHA256" \
            "${SETUP##*/}" "$SETUP_SHA256" SHA256SUMS.txt "$SUMS_SHA256" | LC_ALL=C sort)"
          uploaded="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[] | [.name,.digest,.state] | @tsv' | LC_ALL=C sort)"
          [[ "$uploaded" == "$expected" ]]
          [[ "$(gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false --jq '.draft')" == false ]]
          # These commands prove that the external immutable-release policy
          # actually protected this publication and its three release assets.
          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          for asset in "$ZIP" "$SETUP" release-assets/SHA256SUMS.txt; do
            gh release verify-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY"
          done
  signing_build:
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && (inputs.signpath_test || inputs.signpath_release))
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    outputs:
      mode: ${{ steps.context.outputs.mode }}
      certificate-thumbprint: ${{ steps.context.outputs.certificate-thumbprint }}
      version: ${{ steps.context.outputs.version }}
      bundle-id: ${{ steps.bundle.outputs.artifact-id }}
      payload-id: ${{ steps.payload.outputs.artifact-id }}
      payload-digest: ${{ steps.payload.outputs.artifact-digest }}
    steps:
      - name: Check out source and main ancestry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require reviewed source and signing activation
        id: context
        env:
          CONFIRMED_TEST: ${{ inputs.signpath_test }}
          CONFIRMED_RELEASE: ${{ inputs.signpath_release }}
          TEST_ENABLED: ${{ vars.SIGNPATH_TEST_ENABLED }}
          RELEASE_ENABLED: ${{ vars.SIGNPATH_RELEASE_ENABLED }}
        run: ./scripts/signing_pipeline.ps1 -Stage Initialize
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12.10'
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.404'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-build.txt
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build unsigned application
        run: |
          python tools/make_icon.py halo.ico
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/make_version.py version_info.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/build_settings.ps1 -ToolchainCache (Join-Path $env:RUNNER_TEMP 'halo-settings-aot-toolchain')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/build_exe.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Archive native settings symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: HaloBattery-Settings-symbols-${{ github.sha }}
          path: .build/settings-ui-obj/**/native/HaloBattery.Settings.pdb
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Extract verified pinned Inno compiler
        id: compiler
        run: |
          $compiler = ./scripts/get_inno.ps1
          "path=$compiler" >> $env:GITHUB_OUTPUT
      - name: Stage application executables and the pinned Inno helper
        env:
          SIGNING_MODE: ${{ steps.context.outputs.mode }}
          CERTIFICATE_THUMBPRINT: ${{ steps.context.outputs.certificate-thumbprint }}
          COMPILER: ${{ steps.compiler.outputs.path }}
        run: ./scripts/signing_pipeline.ps1 -Stage StageBuild -CompilerPath $env:COMPILER -OutputDirectory signpath-stage
      - name: Upload bundle
        id: bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: HaloBattery-signing-unsigned-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: signpath-stage/bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload payload
        id: payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: HaloBattery-signing-unsigned-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: signpath-stage/payload/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  test_sign_payload:
    if: always() && !cancelled() && needs.signing_build.result == 'success' && needs.signing_build.outputs.mode == 'Test'
    needs: [signing_build]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    environment: signpath-test
    timeout-minutes: 30
    env:
      CERTIFICATE_THUMBPRINT: ${{ needs.signing_build.outputs.certificate-thumbprint }}
      APP_VERSION: ${{ needs.signing_build.outputs.version }}
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact-id: ${{ steps.output.outputs.artifact-id }}
      request-id: ${{ steps.sign.outputs.signing-request-id }}
    steps:
      - name: Require the protected signing credential
        env:
          SIGNING_TOKEN: ${{ secrets.SIGNPATH_TEST_API_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_TOKEN)) { throw 'Missing protected signing credential' }
          if ($env:CERTIFICATE_THUMBPRINT -cnotmatch '^[A-F0-9]{40}$') { throw 'Invalid reviewed certificate pin' }
      - name: Submit the exact payload artifact to test-signing
        id: sign
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_TEST_API_TOKEN }}
          organization-id: c54d1cb1-9c0a-478b-8eb8-036eb7084713
          project-slug: HaloBattery
          signing-policy-slug: test-signing
          artifact-configuration-slug: payload-inno-test
          github-artifact-id: ${{ needs.signing_build.outputs.payload-id }}
          wait-for-completion: true
          output-artifact-directory: signpath-output
      - name: Stage only the expected embedded signer and paths
        run: |
          $root = (Resolve-Path -LiteralPath signpath-output).Path
          $entries = @(Get-Item -LiteralPath $root) + @(Get-ChildItem -LiteralPath $root -Recurse -Force)
          if (@($entries | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }).Count) { throw 'Linked signing output' }
          $actual = @(Get-ChildItem -LiteralPath $root -Recurse -Force | ForEach-Object { [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/') })
          $files = @('HaloBattery.exe', '_internal/settings-ui/HaloBattery.Settings.exe', 'inno-helper-amd64.exe')
          $expected = $files + @('_internal', '_internal/settings-ui')
          if ($actual.Count -ne 5 -or @(Compare-Object $expected $actual -CaseSensitive).Count) { throw 'Unexpected payload paths' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath (Join-Path $root $file)
            if ($null -eq $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ine $env:CERTIFICATE_THUMBPRINT -or
                $signature.SignatureType.ToString() -cne 'Authenticode') { throw 'Unexpected embedded signer' }
          }
          # Staged only: token-free jobs perform complete cryptographic and
          # unchanged-content acceptance before these outputs can be packaged.
      - name: Upload output
        id: output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: HaloBattery-test-signed-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: signpath-output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  release_sign_payload:
    if: always() && !cancelled() && needs.signing_build.result == 'success' && needs.signing_build.outputs.mode == 'Production'
    needs: [signing_build]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    environment: signpath-release
    timeout-minutes: 30
    env:
      CERTIFICATE_THUMBPRINT: ${{ needs.signing_build.outputs.certificate-thumbprint }}
      APP_VERSION: ${{ needs.signing_build.outputs.version }}
    defaults:
      run:
        shell: pwsh
    outputs:
      artifact-id: ${{ steps.output.outputs.artifact-id }}
      request-id: ${{ steps.sign.outputs.signing-request-id }}
    steps:
      - name: Require the protected signing credential
        env:
          SIGNING_TOKEN: ${{ secrets.SIGNPATH_RELEASE_API_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_TOKEN)) { throw 'Missing protected signing credential' }
          if ($env:CERTIFICATE_THUMBPRINT -cnotmatch '^[A-F0-9]{40}$') { throw 'Invalid reviewed certificate pin' }
      - name: Submit the exact payload artifact to release-signing
        id: sign
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_RELEASE_API_TOKEN }}
          organization-id: c54d1cb1-9c0a-478b-8eb8-036eb7084713
          project-slug: HaloBattery
          signing-policy-slug: release-signing
          artifact-configuration-slug: payload-inno-release
          github-artifact-id: ${{ needs.signing_build.outputs.payload-id }}
          wait-for-completion: true
          output-artifact-directory: signpath-output
      - name: Stage only the expected embedded signer and paths
        run: |
          $root = (Resolve-Path -LiteralPath signpath-output).Path
          $entries = @(Get-Item -LiteralPath $root) + @(Get-ChildItem -LiteralPath $root -Recurse -Force)
          if (@($entries | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }).Count) { throw 'Linked signing output' }
          $actual = @(Get-ChildItem -LiteralPath $root -Recurse -Force | ForEach-Object { [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\', '/') })
          $files = @('HaloBattery.exe', '_internal/settings-ui/HaloBattery.Settings.exe', 'inno-helper-amd64.exe')
          $expected = $files + @('_internal', '_internal/settings-ui')
          if ($actual.Count -ne 5 -or @(Compare-Object $expected $actual -CaseSensitive).Count) { throw 'Unexpected payload paths' }
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath (Join-Path $root $file)
            if ($null -eq $signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ine $env:CERTIFICATE_THUMBPRINT -or
                $signature.SignatureType.ToString() -cne 'Authenticode') { throw 'Unexpected embedded signer' }
          }
          # Staged only: token-free jobs perform complete cryptographic and
          # unchanged-content acceptance before these outputs can be packaged.
      - name: Upload output
        id: output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: HaloBattery-release-signed-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: signpath-output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  signing_prepare:
    if: always() && !cancelled() && needs.signing_build.result == 'success' && ((needs.signing_build.outputs.mode == 'Test' && needs.test_sign_payload.result == 'success' && needs.release_sign_payload.result == 'skipped') || (needs.signing_build.outputs.mode == 'Production' && needs.release_sign_payload.result == 'success' && needs.test_sign_payload.result == 'skipped'))
    needs: [signing_build, test_sign_payload, release_sign_payload]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    timeout-minutes: 30
    env:
