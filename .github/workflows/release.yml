name: Build and release

# Push a tag like v1.8.0 and GitHub builds Halo Battery on a Windows runner and
# attaches HaloBattery-<version>.zip (a HaloBattery folder with HaloBattery.exe
# and its libraries, also what the in-app updater downloads) and
# HaloBattery-<version>-setup.exe (installer/HaloBattery.iss) to the release for
# that tag (the release is created if it does not exist yet). The release text
# is the matching section of CHANGELOG.md.
# "Run workflow" on the Actions tab builds it without releasing; download it
# from the run's artifacts.
#
# The app is built as a folder, not a single self-extracting .exe: a one-file
# PyInstaller .exe unpacks Python into a temp folder at every start, which
# antivirus machine-learning heuristics often flag as a trojan.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Check that the tag matches VERSION
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $m = Select-String -Path halo_battery.pyw -Pattern '^VERSION = "(.+)"'
          $ver = $m.Matches[0].Groups[1].Value
          if ($ver -ne $tag) {
            Write-Error "Tag v$tag does not match VERSION = `"$ver`" in halo_battery.pyw"
            exit 1
          }
          Write-Host "Version $ver"

      - name: Require stable tags to belong to main
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Smoke test
        # imports every module and runs one full poll on the runner (no devices there)
        run: python halo_battery.pyw --probe

      - name: Build HaloBattery
        run: |
          python tools/make_icon.py halo.ico
          python tools/make_version.py version_info.txt
          python -m PyInstaller --noconfirm --onedir --windowed --noupx --name HaloBattery --icon halo.ico --version-file version_info.txt --hidden-import hid --hidden-import pystray._win32 --hidden-import serial --hidden-import serial.tools.list_ports --add-data "docs/licenses:licenses" --add-data "docs/credits.md:licenses" --hidden-import usb.backend.libusb1 --collect-data libusb_package halo_battery.pyw

      - name: Zip the HaloBattery folder
        id: zip
        shell: pwsh
        run: |
          $m = Select-String -Path halo_battery.pyw -Pattern '^VERSION = "(.+)"'
          $ver = $m.Matches[0].Groups[1].Value
          $zip = "HaloBattery-$ver.zip"
          Compress-Archive -Path dist/HaloBattery -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT
          Write-Host "Built $zip"

      - name: Build the installer
        # Inno Setup turns dist/HaloBattery into HaloBattery-<version>-setup.exe (installer/HaloBattery.iss)
        id: setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit 1 } }
          $m = Select-String -Path halo_battery.pyw -Pattern '^VERSION = "(.+)"'
          $ver = $m.Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$ver" installer/HaloBattery.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "setup=dist/HaloBattery-$ver-setup.exe" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: HaloBattery
          path: |
            dist/HaloBattery
            ${{ steps.zip.outputs.zip }}
            ${{ steps.setup.outputs.setup }}

      - name: Release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        # fails if CHANGELOG.md has no section for this version
        run: python tools/release_notes.py ${{ github.ref_name }} --out release_notes.md

      - name: Checksums
        id: sums
        shell: pwsh
        # SHA256SUMS.txt lists the ZIP and the installer. The updater only
        # downloads HaloBattery-<version>.zip, so this extra asset is ignored by it.
        run: |
          $files = @("${{ steps.zip.outputs.zip }}", "${{ steps.setup.outputs.setup }}")
          $lines = foreach ($f in $files) { "{0} *{1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), (Split-Path $f -Leaf) }
          $lines | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Attach to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: |
            ${{ steps.zip.outputs.zip }}
            ${{ steps.setup.outputs.setup }}
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          body_path: release_notes.md
