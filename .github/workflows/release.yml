          if ($id -cnotmatch '^[0-9]+$' -or $request -cnotmatch '^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$' -or
              @($other | Where-Object { -not [string]::IsNullOrEmpty($_) }).Count) {
            throw 'Missing or mixed signing outputs'
          }
          "artifact-id=$id" >> $env:GITHUB_OUTPUT
          "request-id=$request" >> $env:GITHUB_OUTPUT
      - name: Select exactly the successful internal signer
        id: choose_internal
        env:
          TEST_ID: ${{ needs.test_sign_internal.outputs.artifact-id }}
          TEST_REQUEST: ${{ needs.test_sign_internal.outputs.request-id }}
          RELEASE_ID: ${{ needs.release_sign_internal.outputs.artifact-id }}
          RELEASE_REQUEST: ${{ needs.release_sign_internal.outputs.request-id }}
        run: |
          if ($env:SIGNING_MODE -ceq 'Test') {
            $id, $request = $env:TEST_ID, $env:TEST_REQUEST
            $other = @($env:RELEASE_ID, $env:RELEASE_REQUEST)
          } elseif ($env:SIGNING_MODE -ceq 'Production') {
            $id, $request = $env:RELEASE_ID, $env:RELEASE_REQUEST
            $other = @($env:TEST_ID, $env:TEST_REQUEST)
          } else { throw 'Invalid signing mode' }
          if ($id -cnotmatch '^[0-9]+$' -or $request -cnotmatch '^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$' -or
              @($other | Where-Object { -not [string]::IsNullOrEmpty($_) }).Count) {
            throw 'Missing or mixed signing outputs'
          }
          "artifact-id=$id" >> $env:GITHUB_OUTPUT
          "request-id=$request" >> $env:GITHUB_OUTPUT
      - name: Select exactly the successful installer signer
        id: choose_installer
        env:
          TEST_ID: ${{ needs.test_sign_installer.outputs.artifact-id }}
          TEST_REQUEST: ${{ needs.test_sign_installer.outputs.request-id }}
          RELEASE_ID: ${{ needs.release_sign_installer.outputs.artifact-id }}
          RELEASE_REQUEST: ${{ needs.release_sign_installer.outputs.request-id }}
        run: |
          if ($env:SIGNING_MODE -ceq 'Test') {
            $id, $request = $env:TEST_ID, $env:TEST_REQUEST
            $other = @($env:RELEASE_ID, $env:RELEASE_REQUEST)
          } elseif ($env:SIGNING_MODE -ceq 'Production') {
            $id, $request = $env:RELEASE_ID, $env:RELEASE_REQUEST
            $other = @($env:TEST_ID, $env:TEST_REQUEST)
          } else { throw 'Invalid signing mode' }
          if ($id -cnotmatch '^[0-9]+$' -or $request -cnotmatch '^[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12}$' -or
              @($other | Where-Object { -not [string]::IsNullOrEmpty($_) }).Count) {
            throw 'Missing or mixed signing outputs'
          }
          "artifact-id=$id" >> $env:GITHUB_OUTPUT
          "request-id=$request" >> $env:GITHUB_OUTPUT
      - name: Download unsigned installer from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.signing_package.outputs.installer-id }}
          path: signpath-input/unsigned-installer
      - name: Download staged signed installer from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.choose_installer.outputs.artifact-id }}
          path: signpath-input/signed-installer
      - name: Download packaged application from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.signing_package.outputs.package-id }}
          path: signpath-input/packaged
      - name: Download verified Inno engine proof from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.signing_package.outputs.proof-id }}
          path: signpath-input/inno
      - name: Verify every signature, original contents and final checksums
        env:
          PAYLOAD_ARTIFACT: ${{ needs.signing_build.outputs.payload-id }}
          PAYLOAD_DIGEST: ${{ needs.signing_build.outputs.payload-digest }}
          PAYLOAD_REQUEST: ${{ steps.choose_payload.outputs.request-id }}
          INTERNAL_ARTIFACT: ${{ needs.signing_prepare.outputs.internal-id }}
          INTERNAL_DIGEST: ${{ needs.signing_prepare.outputs.internal-digest }}
          INTERNAL_REQUEST: ${{ steps.choose_internal.outputs.request-id }}
          INSTALLER_ARTIFACT: ${{ needs.signing_package.outputs.installer-id }}
          INSTALLER_DIGEST: ${{ needs.signing_package.outputs.installer-digest }}
          INSTALLER_REQUEST: ${{ steps.choose_installer.outputs.request-id }}
        run: ./scripts/signing_pipeline.ps1 -Stage Finalize -BundleDirectory signpath-input/packaged -SignedDirectory signpath-input/signed-installer -UnsignedDirectory signpath-input/unsigned-installer -WorkDirectory signpath-input/inno -OutputDirectory release-assets
      - name: Exercise signed temporary engines, install, upgrade and uninstall
        env:
          APP_VERSION: ${{ needs.signing_build.outputs.version }}
        run: |
          $name = if ($env:SIGNING_MODE -ceq 'Test') { 'HaloBattery-test-setup.exe' } else { "HaloBattery-$env:APP_VERSION-setup.exe" }
          ./scripts/test_signed_installer.ps1 -InstallerPath (Join-Path release-assets $name) -SignedCacheDirectory signpath-input/inno/final-verified-cache -SigningMode $env:SIGNING_MODE -CertificateThumbprint $env:CERTIFICATE_THUMBPRINT -ReportPath signpath-input/inno/audit/installer-smoke.json
      - name: Upload audit
        id: audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: HaloBattery-signing-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: signpath-input/inno/audit/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Upload test_assets
        id: test_assets
        if: needs.signing_build.outputs.mode == 'Test'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: HaloBattery-SELF-SIGNED-TEST-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload release_assets
        id: release_assets
        if: needs.signing_build.outputs.mode == 'Production'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: HaloBattery-production-release-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
