name: Isolated signed Inno probe
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    if: github.repository == 'HeyOkay/HaloBattery' && github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out diagnostic harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require the exact existing TEST source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = gh api repos/HeyOkay/HaloBattery/actions/runs/45695498244 | ConvertFrom-Json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($run.head_sha -cne '24f9f26e3fa85c73d542279ba19780c563b1c0a7' -or $run.event -cne 'workflow_dispatch' -or $run.head_branch -cne 'pre-release' -or $run.run_attempt -ne 1) { throw 'Unexpected TEST artifact source' }
      - name: Download the exact signed TEST installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: 15060893812
          run-id: 45695498244
          github-token: ${{ github.token }}
          path: probe-input/installer
      - name: Download the exact signed Inno cache proof
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: 15060524417
          run-id: 45695498244
          github-token: ${{ github.token }}
          path: probe-input/inno
      - name: Verify pinned file digests and exercise isolated installer
        run: |
          $setup = 'probe-input/installer/HaloBattery-test-setup.exe'
          $cache = 'probe-input/inno/verified-cache/uninst-6.7.4-e8768009ad.e32'
          if ((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash -cne '9491D9D6831869EB4561DD5714681A937B22FB490BB3F9BEDCB51F825F8F402D') { throw 'Unexpected TEST installer bytes' }
          if ((Get-FileHash -LiteralPath $cache -Algorithm SHA256).Hash -cne '12776A4F2226783599387D583AC4A24E75A5101229CA540744543BED4B731CB2') { throw 'Unexpected signed cache bytes' }
          ./scripts/test_signed_installer.ps1 -InstallerPath $setup -SignedCacheDirectory probe-input/inno/verified-cache -SigningMode Test -CertificateThumbprint 17F9F411C424674855A077F9A120A7A434990AF1 -ReportPath probe-evidence/installer-smoke.json
      - name: Retain diagnostic evidence on success or failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Inno-install-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: probe-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7